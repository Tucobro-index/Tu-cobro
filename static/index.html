<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a110f">
<title>Tu Cobro</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
<style>
:root{--ac:#10b981;--on:#fff;--bg:#eef3f1;--txt:#0f1f1a;--mut:#5d6f68;--glass:rgba(255,255,255,.62);--bd:rgba(255,255,255,.85);--solid:#fff;--sh:0 10px 30px rgba(20,60,45,.12);--inp:rgba(255,255,255,.75);--ln:rgba(15,31,26,.08)}
[data-theme=dark]{--bg:#0a110f;--txt:#e9f3ef;--mut:#92a69e;--glass:rgba(24,36,32,.55);--bd:rgba(255,255,255,.09);--solid:#16221e;--sh:0 12px 32px rgba(0,0,0,.45);--inp:rgba(255,255,255,.06);--ln:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-variant-numeric:tabular-nums}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);z-index:-1;background:var(--ac);transition:background .4s}
body::before{width:340px;height:340px;top:-90px;right:-100px;opacity:.38}body::after{width:280px;height:280px;bottom:50px;left:-110px;opacity:.2}

#app{max-width:480px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 16px 120px}
@media(min-width:768px){
  body{display:grid;place-items:center;padding:30px 0}
  #app{width:100%;max-width:520px;background:var(--solid);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:32px;padding:32px 32px 130px;position:relative}
  nav{width:calc(100% - 64px) !important;max-width:456px !important;left:32px !important;transform:none !important}
}

.glass{background:var(--glass);border:1px solid var(--bd);box-shadow:var(--sh);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-radius:24px}
.card{padding:18px;margin-bottom:12px}
.top{display:flex;align-items:center;gap:12px;margin:6px 0 18px}.top h1{font-size:1.2rem;font-weight:800;line-height:1.15}.top small{color:var(--mut);font-size:.78rem;text-transform:capitalize}
.sp{flex:1}.row{display:flex;align-items:center;gap:10px}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--bd);background:var(--glass);color:var(--txt);font-size:1rem;cursor:pointer;backdrop-filter:blur(12px)}
.av{width:46px;height:46px;border-radius:16px;background:var(--ac);color:var(--on);display:grid;place-items:center;font-weight:800;font-size:1.1rem;object-fit:cover;flex:none;cursor:pointer}
.hero{padding:22px;background:linear-gradient(140deg,var(--ac),color-mix(in srgb,var(--ac) 50%,#000));color:var(--on);border:0}
.hero small{opacity:.88;font-weight:600}.hero b{display:block;font-size:2.4rem;font-weight:800;letter-spacing:-.03em;margin:4px 0 14px}
.pill{background:rgba(255,255,255,.22);padding:4px 11px;border-radius:99px;font-size:.7rem;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:2px 0 14px}
.stat small{color:var(--mut);font-weight:600;font-size:.78rem}.stat b{display:block;font-size:1.3rem;font-weight:800;margin-top:4px}.stat i{color:var(--ac);margin-right:6px}
.tile{padding:14px 4px;text-align:center;cursor:pointer;font-size:.74rem;font-weight:700;border-radius:20px}.tile i{display:block;font-size:1.35rem;color:var(--ac);margin-bottom:8px}
label{display:block;font-size:.8rem;font-weight:700;color:var(--mut);margin:14px 0 6px}
input,select{width:100%;padding:14px;border-radius:15px;border:1px solid var(--bd);background:var(--inp);color:var(--txt);font:inherit;outline:0}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}input[readonly]{font-weight:800;color:var(--ac)}
.pass-box{position:relative;display:flex;align-items:center}
.pass-box input{padding-right:45px}
.pass-toggle{position:absolute;right:12px;background:none;border:0;color:var(--mut);cursor:pointer;font-size:1.1rem;padding:4px}
.btn{width:100%;padding:15px;border:0;border-radius:16px;background:var(--ac);color:var(--on);font:800 .95rem Manrope;cursor:pointer;margin-top:16px;box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 38%,transparent)}
.btn.alt{background:var(--glass);color:var(--txt);border:1px solid var(--bd);box-shadow:none;margin-top:10px}.btn.red{background:#ef4444;color:#fff}
.btn:active,.sm:active{transform:scale(.97)}
.cl{padding:16px;margin-bottom:12px}.cl h3{font-size:1.02rem;font-weight:800}.cl small{color:var(--mut);line-height:1.5}
.bdg{padding:5px 11px;border-radius:99px;font-size:.7rem;font-weight:800}
.Pendiente{background:rgba(239,68,68,.15);color:#ef4444}.En.espera{background:rgba(245,158,11,.18);color:#d98a06}.Pagado{background:rgba(16,185,129,.17);color:#0d9f6e}
.acts{display:flex;gap:8px;margin-top:12px}.sm{flex:1;padding:11px;border-radius:13px;border:1px solid var(--bd);background:var(--inp);color:var(--txt);font:700 .82rem Manrope;cursor:pointer}.sm.p{background:var(--ac);color:var(--on);border:0}.sm.w{color:#1fa855}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(448px,calc(100% - 28px));display:flex;padding:7px;gap:3px;z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 0;border-radius:18px;font:700 .66rem Manrope;cursor:pointer}nav button i{display:block;font-size:1.1rem;margin-bottom:3px}nav button.on{background:var(--ac);color:var(--on)}
.sw{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:6px 0}.sw button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw button.on{border-color:var(--txt)}
.brand{text-align:center;margin:30px 0 22px}.brand .av{margin:0 auto 12px;width:68px;height:68px;font-size:1.7rem;border-radius:24px;cursor:default}.brand h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}.brand p{color:var(--mut);font-size:.9rem;margin-top:4px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--ln);font-weight:600;font-size:.92rem}.ln:last-child{border:0}.ln b{font-weight:800;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:.82rem}th,td{padding:10px 6px;text-align:left;border-bottom:1px solid var(--ln)}th{color:var(--mut);font-weight:700;font-size:.72rem}td:last-child,th:last-child{text-align:right}.tw{overflow-x:auto}
.empty{text-align:center;color:var(--mut);padding:30px 10px}.warn{background:rgba(245,158,11,.16);color:#d98a06;padding:12px 14px;border-radius:16px;font-weight:700;font-size:.85rem;margin-bottom:12px}
.link{display:block;text-align:center;border:0;background:none;color:var(--ac);font:700 .85rem Manrope;margin:14px auto 0;cursor:pointer}
option{background:var(--solid);color:var(--txt)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

body{background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--txt) 7%,transparent) 1px,transparent 0);background-size:22px 22px}
.card,.cl,.tile{position:relative}
.card::before,.cl::before,.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(150deg,rgba(255,255,255,.6),transparent 40%,color-mix(in srgb,var(--ac) 40%,transparent));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.av{background:linear-gradient(140deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#000));box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 40%,transparent)}
.brand .av{box-shadow:0 14px 34px color-mix(in srgb,var(--ac) 50%,transparent)}
.btn{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 68%,#000))}
.hero{background:radial-gradient(120% 120% at 100% 0%,rgba(255,255,255,.3),transparent 48%),linear-gradient(140deg,var(--ac),color-mix(in srgb,var(--ac) 42%,#000));overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;bottom:-50px;width:190px;height:190px;border-radius:50%;border:28px solid rgba(255,255,255,.1);pointer-events:none}
.hero b{font-size:2.8rem;margin:2px 0 6px}
.ring{--p:0;width:80px;height:80px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.25) 0);display:grid;place-items:center;flex:none;position:relative;z-index:1}
.ring i{width:62px;height:62px;border-radius:50%;background:color-mix(in srgb,var(--ac) 60%,#000);display:grid;place-items:center;font:800 .95rem Manrope;font-style:normal;color:#fff}
.chip{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);margin-bottom:10px}.chip i{margin:0}
.tile i{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;margin:0 auto 9px;background:color-mix(in srgb,var(--ac) 16%,transparent);font-size:1.2rem}
nav button{transition:all .2s}nav button.on{box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 45%,transparent)}
.cl{border-left:5px solid var(--sc,var(--ac))}
.ci{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:1.1rem;background:color-mix(in srgb,var(--sc) 18%,transparent);color:var(--sc);flex:none}
.pg{height:6px;border-radius:9px;background:var(--ln);margin-top:12px;overflow:hidden}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#fff));border-radius:9px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.strip div{padding:11px 6px;text-align:center;border-radius:18px;background:var(--glass);border:1px solid var(--bd);font-size:.7rem;font-weight:700;color:var(--mut)}.strip b{display:block;font-size:1.35rem;font-weight:800;color:var(--txt)}
.glass.card>.ln:last-child{margin-top:6px;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--ac) 14%,transparent)}
.rng{-webkit-appearance:none;appearance:none;height:14px;border-radius:99px;padding:0;border:0;outline:0;background:var(--ln)}
.rng.hue{background:linear-gradient(90deg,hsl(0 82% 50%),hsl(60 82% 48%),hsl(120 82% 42%),hsl(180 82% 42%),hsl(240 82% 56%),hsl(300 82% 50%),hsl(360 82% 50%))}
.rng.lit{background:linear-gradient(90deg,#000,var(--ac),#fff)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:5px solid var(--ac);box-shadow:0 3px 10px rgba(0,0,0,.3);cursor:pointer}
.rng::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:5px solid var(--ac);cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),money=n=>'$'+Math.round(n||0).toLocaleString('es-CO'),v=id=>document.getElementById(id)?.value.trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');
const st={token:localStorage.tc_token||'',user:null,view:'home',date:today(),d:null};
const ACC={Esmeralda:['#10b981','#fff'],'Azul eléctrico':['#2f6bff','#fff'],Morado:['#8b5cf6','#fff'],Fucsia:['#d946ef','#fff'],Ámbar:['#f59e0b','#201500']};
const css=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const S=o=>Swal.fire({background:css('--solid'),color:css('--txt'),confirmButtonColor:css('--ac'),cancelButtonText:'Cancelar',...o});
const toast=(t,icon='success')=>S({toast:true,position:'top',icon,title:t,showConfirmButton:false,timer:2200});
function theme(){const t=localStorage.tc_theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),a=localStorage.tc_custom?[localStorage.tc_custom,onFor(localStorage.tc_custom)]:(ACC[localStorage.tc_acc]||ACC.Esmeralda),r=document.documentElement;r.dataset.theme=t;r.style.setProperty('--ac',a[0]);r.style.setProperty('--on',a[1])}
const toggleTheme=()=>{localStorage.tc_theme=document.documentElement.dataset.theme==='dark'?'light':'dark';theme();render()};
const swatches=()=>Object.entries(ACC).map(([n,c])=>`<button title="${n}" aria-label="${n}" style="background:${c[0]}" class="${!localStorage.tc_custom&&(localStorage.tc_acc||'Esmeralda')===n?'on':''}" onclick="setAcc('${n}')"></button>`).join('');
const pickColor=()=>S({title:'Color de la app',html:`<div class="sw">${swatches()}</div>${colorBar()}`,showConfirmButton:false,showCloseButton:true});
const setAcc=n=>{localStorage.removeItem('tc_custom');localStorage.tc_acc=n;theme();Swal.close();render()};
async function api(p,m='GET',b){const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json','X-Token':st.token},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(r.status===401&&st.user)endSession();if(!r.ok)throw new Error(j.error||'Error de conexión');return j}
const run=async f=>{try{await f()}catch(e){S({icon:'error',title:'No se pudo completar',text:e.message})}};
function enter(j){st.token=j.token;st.user=j.user;localStorage.tc_token=j.token;st.view='home';st.d=null;load()}
function endSession(){st.token='';st.user=null;st.d=null;localStorage.removeItem('tc_token');render()}
const logout=()=>run(async()=>{await api('logout','POST');endSession()});
async function load(){try{st.d=await api('data?date='+st.date);render()}catch(e){if(st.user)S({icon:'error',title:'Sin conexión',text:e.message})}}
const nm=u=>u.nombre||u.usuario,avatar=(u,x='')=>u.foto?`<img class="av" style="${x}" src="${esc(u.foto)}" alt="" onclick="go('perfil')">`:`<div class="av" style="${x}" onclick="go('perfil')">${esc(nm(u)[0]).toUpperCase()}</div>`;
const fdate=d=>new Date(d+'T12:00').toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});

const hex2=(h,s,l)=>{s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')};
const onFor=h=>{const [r,g,b]=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(c=>c<=.03928?c/12.92:((c+.055)/1.055)**2.4);return .2126*r+.7152*g+.0722*b>.4?'#1a1200':'#fff'};
const colorBar=()=>`<div style="margin-top:18px;text-align:left"><label style="margin:0 0 8px">Tono: elige cualquier color</label><input id="hue" class="rng hue" type="range" min="0" max="360" value="${localStorage.tc_h||150}" oninput="setCustom()" aria-label="Tono"><label>Intensidad</label><input id="lit" class="rng lit" type="range" min="30" max="62" value="${localStorage.tc_l||42}" oninput="setCustom()" aria-label="Intensidad"></div>`;
function setCustom(){const h=+$('#hue').value,l=+$('#lit').value;localStorage.tc_h=h;localStorage.tc_l=l;localStorage.tc_custom=hex2(h,82,l);theme();document.querySelectorAll('.sw button').forEach(b=>b.classList.remove('on'))}
function countUp(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const e=$('.hero b[data-v]');if(!e)return;const T=+e.dataset.v,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/800);e.textContent=money(T*(1-Math.pow(1-k,3)));k<1&&requestAnimationFrame(f)})(t0)}
const EC={'Pendiente':'#ef4444','En espera':'#f59e0b','Pagado':'#10b981'};
/* ---------- Acceso ---------- */
function authView(){return `
<div class="top"><div class="sp"></div><button class="ib" onclick="pickColor()" aria-label="Color"><i class="fa-solid fa-palette"></i></button><button class="ib" onclick="toggleTheme()" aria-label="Tema"><i class="fa-solid fa-circle-half-stroke"></i></button></div>
<div class="brand"><div class="av"><i class="fa-solid fa-hand-holding-dollar"></i></div><h1>Tu Cobro</h1><p>Tu ruta, tu caja y tus clientes en un solo lugar</p></div>
<div class="glass card"><form onsubmit="event.preventDefault();doLogin()">
<label style="margin-top:0">Usuario</label><input id="a1" autocomplete="username" required>
<label>Contraseña</label>
<div class="pass-box">
  <input id="a3" type="password" autocomplete="current-password" required>
  <button type="button" class="pass-toggle" onclick="togglePass()"><i id="eye-icon" class="fa-solid fa-eye"></i></button>
</div>
<button class="btn">Iniciar sesión</button></form>
<button class="link" onclick="recover()">¿Olvidaste tu contraseña?</button></div>`}
function togglePass(){const i=$('#a3'),e=$('#eye-icon');if(i.type==='password'){i.type='text';e.className='fa-solid fa-eye-slash'}else{i.type='password';e.className='fa-solid fa-eye'}}
const doLogin=()=>run(async()=>enter(await api('login','POST',{id:v('a1'),password:v('a3')})));
function recover(){S({title:'Recuperar acceso',html:'<input id="r1" class="swal2-input" placeholder="Usuario"><input id="r2" class="swal2-input" placeholder="Código de seguridad" inputmode="numeric"><input id="r3" type="password" class="swal2-input" placeholder="Nueva contraseña (mín. 6)">',showCancelButton:true,confirmButtonText:'Cambiar clave',preConfirm:()=>api('recover','POST',{id:v('r1'),pin:v('r2'),password:v('r3')}).catch(e=>Swal.showValidationMessage(e.message))}).then(r=>r.isConfirmed&&toast('Contraseña actualizada'))}

/* ---------- Pantallas ---------- */
const head=t=>`<div class="top">${avatar(st.user)}<div><h1>${t}</h1><small>${fdate(st.date)}</small></div><div class="sp"></div><button class="ib" onclick="pickColor()" aria-label="Color"><i class="fa-solid fa-palette"></i></button><button class="ib" onclick="toggleTheme()" aria-label="Tema"><i class="fa-solid fa-circle-half-stroke"></i></button></div>`;
const dateBar=()=>`<input type="date" value="${st.date}" onchange="st.date=this.value||today();load()" style="margin-bottom:12px" aria-label="Fecha">`;
const closedBanner=()=>st.d.abierta?'':'<div class="warn"><i class="fa-solid fa-lock"></i> La caja de este día está cerrada. Ábrela para registrar movimientos.</div>';
function home(){const d=st.d,t=d.rows.length,p=d.rows.filter(r=>r.estado==='Pagado').length,pe=d.rows.filter(r=>r.estado==='Pendiente').length;return head('Hola, '+esc(nm(st.user)))+dateBar()+`
<div class="glass card hero"><div class="row"><small class="sp">Recaudo del día</small><span class="pill">${d.abierta?'Caja abierta':'Caja cerrada'}</span></div><div class="row" style="margin-top:8px"><div class="sp"><b data-v="${d.recaudo}">${money(d.recaudo)}</b><small>${p} de ${t} clientes al día</small></div><div class="ring" style="--p:${t?Math.round(p/t*100):0}"><i>${t?Math.round(p/t*100):0}%</i></div></div></div>
<div class="grid"><div class="glass card stat"><span class="chip"><i class="fa-solid fa-wallet"></i></span><small>Cartera activa</small><b>${money(d.cartera)}</b></div><div class="glass card stat"><span class="chip"><i class="fa-solid fa-money-bill-wave"></i></span><small>Efectivo en caja</small><b>${money(d.caja)}</b></div></div>
<div class="glass card stat"><span class="chip" style="background:rgba(239,68,68,.14);color:#ef4444"><i class="fa-solid fa-hourglass-half"></i></span><small>Pendientes hoy</small><b style="color:#ef4444">${pe}</b></div>
<div class="g4">${[['ruta','fa-route','Ruta'],['nuevo','fa-circle-plus','Crédito'],['activos','fa-list-check','Activos'],['reportes','fa-chart-pie','Reportes']].map(x=>`<div class="glass tile" onclick="go('${x[0]}')"><i class="fa-solid ${x[1]}"></i>${x[2]}</div>`).join('')}</div>`}
function ruta(){const d=st.d,n=e=>d.rows.filter(r=>r.estado===e).length;return head('Ruta de cobro')+dateBar()+closedBanner()+`<div class="strip"><div><b style="color:#ef4444">${n('Pendiente')}</b>Pendientes</div><div><b style="color:#d98a06">${n('En espera')}</b>En espera</div><div><b style="color:#0d9f6e">${n('Pagado')}</b>Pagados</div></div>`+(d.rows.length?d.rows.map(c=>`
<div class="glass cl" style="--sc:${EC[c.estado]}"><div class="row"><div class="ci">${esc((c.cliente[0]||'?').toUpperCase())}</div><div class="sp"><h3>${esc(c.cliente)}</h3><small>${c.cc?'CC '+esc(c.cc)+' · ':''}${esc(c.direccion)}<br>Cuota ${money(c.cuota)} · Faltan ${c.faltan} · Saldo ${money(c.saldo)}</small></div><span class="bdg ${c.estado.replace(' ','.')}">${c.estado}</span></div>
${c.hoy?`<small style="display:block;margin-top:6px;color:var(--ac);font-weight:700">Abonado hoy ${money(c.hoy)}</small>`:''}
<div class="pg"><i style="width:${c.total?Math.min(100,(c.total-c.saldo)/c.total*100):0}%"></i></div><div class="acts"><button class="sm p" onclick="abonar('${c.id}')"><i class="fa-solid fa-hand-holding-dollar"></i> Abonar</button><button class="sm" onclick="espera('${c.id}')"><i class="fa-regular fa-clock"></i> En espera</button><button class="sm w" onclick="wa('${c.id}')" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></button></div></div>`).join(''):'<div class="glass card empty"><i class="fa-solid fa-route fa-2x"></i><p style="margin-top:10px">Aún no hay clientes en la ruta.<br>Registra tu primer crédito para empezar.</p></div>')}
const row=id=>st.d.rows.find(r=>r.id===id);
function abonar(id){const c=row(id);S({title:'Abono de '+c.cliente,text:'Cuota sugerida '+money(c.cuota),input:'number',inputValue:c.cuota,inputAttributes:{min:1},showCancelButton:true,confirmButtonText:'Registrar abono',inputValidator:x=>!(x>0)&&'Ingresa un monto mayor a 0'}).then(async r=>{if(!r.isConfirmed)return;await run(async()=>{const m=+r.value;await api(`credits/${id}/pay`,'POST',{monto:m,fecha:st.date});const saldo=c.saldo-m,snap={...c};await load();const q=await S({icon:'success',title:'Abono registrado',text:'¿Enviar comprobante por WhatsApp?',showCancelButton:true,confirmButtonText:'Enviar por WhatsApp',cancelButtonText:'Ahora no'});if(q.isConfirmed)wa(id,m,saldo,snap)})})}
const espera=id=>run(async()=>{await api(`credits/${id}/wait`,'POST',{fecha:st.date});toast('Cliente en espera');load()});
function wa(id,m,saldo,snap){const c=snap||row(id),t=c.tel.length===10?'57'+c.tel:c.tel;if(!t)return toast('Este cliente no tiene teléfono','warning');const msg=m?`${c.cliente.toUpperCase()}\n> ${st.date}\n> ABONO: ${money(m)}\n> SALDO: ${money(Math.max(saldo,0))}`:`${c.cliente.toUpperCase()}\n> ${st.date}\n> CUOTA DE HOY: ${money(c.cuota)}\n> SALDO: ${money(c.saldo)}`;window.open(`https://api.whatsapp.com/send?phone=${t}&text=${encodeURIComponent(msg)}`,'_blank')}
function nuevo(){return head('Nuevo crédito')+closedBanner()+`<div class="glass card"><form onsubmit="event.preventDefault();guardar()">
<label style="margin-top:0">Posición en la ruta</label><select id="n7"><option value="">Al principio</option>${st.d.rows.map(r=>`<option value="${esc(r.id)}">Después de ${esc(r.cliente)}</option>`).join('')}</select><label>Cédula (CC)</label><input id="n0" inputmode="numeric"><label>Nombre completo</label><input id="n1" required><label>Dirección / barrio</label><input id="n6"><label>Teléfono (WhatsApp)</label><input id="n2" inputmode="tel" placeholder="Ej: 3120000000">
<label>Capital prestado</label><input id="n3" type="number" inputmode="decimal" required oninput="calc()"><div class="grid"><div><label>Interés (%)</label><input id="n4" type="number" value="20" oninput="calc()"></div><div><label>Cuotas (días)</label><input id="n5" type="number" value="24" oninput="calc()"></div></div>
<label>Total a pagar</label><input id="c1" readonly value="$0"><label>Valor de la cuota diaria</label><input id="c2" readonly value="$0">
<button class="btn"><i class="fa-solid fa-floppy-disk"></i>&nbsp; Guardar crédito</button></form></div>`}
function calc(){const c=+v('n3')||0,i=+v('n4')||0,d=+v('n5')||1,t=c*(1+i/100);$('#c1').value=money(t);$('#c2').value=money(Math.ceil(t/d))}
const guardar=()=>run(async()=>{await api('credits','POST',{despues:v('n7'),cc:v('n0'),cliente:v('n1'),direccion:v('n6'),tel:v('n2'),capital:v('n3'),interes:v('n4'),dias:v('n5'),fecha:st.date});toast('Crédito guardado en la ruta');st.view='ruta';load()});
function caja(){const d=st.d,L=(a,b,x='')=>`<div class="ln"><span>${a}</span><b ${x}>${b}</b></div>`;return head('Arqueo de caja')+dateBar()+closedBanner()+`<div class="glass card">
${L('Base inicial',money(d.base))}${L('Ingresos (recaudo del día)',money(d.recaudo))}${L('Entradas adicionales',money(d.extras_total))}${L('Créditos entregados',money(d.egresos))}${L('Gastos del día',money(d.gastos_total))}${L('Efectivo acumulado',money(d.caja),'style="color:var(--ac);font-size:1.25rem"')}</div>
<div class="acts"><button class="sm" style="padding:14px" onclick="base()"><i class="fa-solid fa-vault"></i> Base</button><button class="sm" style="padding:14px" onclick="mov('extra')"><i class="fa-solid fa-circle-plus"></i> Entrada</button><button class="sm" style="padding:14px" onclick="mov('gasto')"><i class="fa-solid fa-receipt"></i> Gasto</button></div>
${d.gastos.length||d.extras.length?`<div class="glass card" style="margin-top:12px">${d.extras.map(x=>`<div class="ln"><span><i class="fa-solid fa-arrow-down" style="color:var(--ac)"></i> ${esc(x.concepto)}</span><b>${money(x.monto)}</b></div>`).join('')}${d.gastos.map(g=>`<div class="ln"><span><i class="fa-solid fa-arrow-up" style="color:#ef4444"></i> ${esc(g.concepto)}</span><b>${money(g.monto)}</b></div>`).join('')}</div>`:''}
<button class="btn ${d.abierta?'red':''}" onclick="cierre()"><i class="fa-solid ${d.abierta?'fa-lock':'fa-lock-open'}"></i>&nbsp; ${d.abierta?'Cerrar caja':'Abrir caja'}</button>`}
const base=()=>S({title:'Base inicial',input:'number',inputValue:st.d.base||'',showCancelButton:true,confirmButtonText:'Guardar'}).then(r=>r.isConfirmed&&run(async()=>{await api('cash','POST',{tipo:'base',fecha:st.date,monto:r.value||0});load()}));
const mov=t=>S({title:t==='gasto'?'Nuevo gasto':'Entrada adicional',html:'<input id="g1" class="swal2-input" placeholder="Concepto'+(t==='gasto'?' (ej. gasolina)':'')+'"><input id="g2" type="number" class="swal2-input" placeholder="Valor">',showCancelButton:true,confirmButtonText:'Guardar',preConfirm:()=>({concepto:v('g1'),monto:v('g2')})}).then(r=>r.isConfirmed&&run(async()=>{await api('cash','POST',{tipo:t,fecha:st.date,...r.value});load()}));
const cierre=()=>S({title:st.d.abierta?'¿Cerrar la caja de este día?':'¿Abrir la caja de nuevo?',text:st.d.abierta?'No podrás registrar abonos ni créditos hasta abrirla.':'',icon:'question',showCancelButton:true,confirmButtonText:'Sí, continuar'}).then(r=>r.isConfirmed&&run(async()=>{await api('cash','POST',{tipo:'cierre',fecha:st.date,abierta:!st.d.abierta});load()}));
function activos(){const d=st.d;return head('Créditos activos')+`<div class="glass card">${d.activos.length?`<div class="tw"><table><thead><tr><th>Cliente</th><th>Total</th><th>Saldo</th></tr></thead><tbody>${d.activos.map(a=>`<tr><td>${esc(a.cliente)}</td><td>${money(a.total)}</td><td><b>${money(a.saldo)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay créditos activos.</div>'}<div class="ln" style="margin-top:8px"><span>Total cartera</span><b>${money(d.cartera)}</b></div></div>`}
function reportes(){const d=st.d;return head('Reportes')+dateBar()+`<button class="btn" style="margin:0 0 12px" onclick="exportar()"><i class="fa-solid fa-file-csv"></i>&nbsp; Descargar reporte CSV / Excel</button><div class="glass card"><div style="font-weight:800;margin-bottom:6px">Historial de abonos</div>${d.historial.length?`<div class="tw"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Abono</th><th>Saldo</th></tr></thead><tbody>${d.historial.map(h=>`<tr><td>${h.fecha.slice(5)}</td><td>${esc(h.cliente)}</td><td>${money(h.monto)}</td><td>${money(h.saldo)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay abonos.</div>'}</div>`}
const exportar=()=>run(async()=>{const r=await fetch('/api/export?date='+st.date,{headers:{'X-Token':st.token}});if(!r.ok)throw new Error('No se pudo generar el reporte');const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=`TuCobro_${st.date}.csv`;a.click();toast('Reporte descargado')});
function perfil(){const u=st.user;return head('Mi perfil')+`<div class="glass card" style="text-align:center"><label for="ph" style="cursor:pointer;margin:0">${avatar(u,'width:88px;height:88px;margin:0 auto 8px;font-size:2rem;border-radius:28px')}<span style="color:var(--ac);font-size:.85rem;font-weight:700"><i class="fa-solid fa-camera"></i> Cambiar foto</span></label><input id="ph" type="file" accept="image/*" hidden onchange="foto(this.files[0])">
<label style="text-align:left">Nombre visible</label><input id="pn" value="${esc(nm(u))}" maxlength="40"><button class="btn" onclick="guardaNombre()">Guardar nombre</button></div>
<div class="glass card"><label style="margin-top:0;text-align:center">Color de la app</label><div class="sw">${swatches()}</div>${colorBar()}</div><button class="btn alt" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i>&nbsp; Cerrar sesión</button>`}
function foto(f){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const s=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,256,256);run(async()=>{st.user=(await api('profile','PUT',{foto:c.toDataURL('image/jpeg',.82)})).user;render();toast('Foto actualizada')})};i.src=r.result};r.readAsDataURL(f)}
const guardaNombre=()=>run(async()=>{st.user=(await api('profile','PUT',{nombre:v('pn')})).user;render();toast('Nombre actualizado')});
const go=x=>{st.view=x;render();scrollTo(0,0)};
const NAV=[['home','fa-house','Inicio'],['ruta','fa-route','Ruta'],['nuevo','fa-circle-plus','Crédito'],['caja','fa-vault','Caja'],['reportes','fa-chart-pie','Reportes']];
function render(){const a=$('#app');if(!st.user){a.innerHTML=authView();return}if(!st.d){a.innerHTML='<div class="empty" style="margin-top:40vh"><i class="fa-solid fa-circle-notch fa-spin fa-2x"></i></div>';return}
a.innerHTML=({home,ruta,nuevo,caja,activos,reportes,perfil})[st.view]()+`<nav class="glass">${NAV.map(n=>`<button class="${st.view===n[0]?'on':''}" onclick="go('${n[0]}')"><i class="fa-solid ${n[1]}"></i>${n[2]}</button>`).join('')}</nav>`;if(st.view==='home'&&!st.shown){st.shown=1;countUp()}}
theme();render();
if(st.token)api('me').then(j=>{st.user=j.user;return load()}).catch(()=>endSession());
</script>
</body>
</html>
